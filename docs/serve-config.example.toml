# Quorum serve config — production-sane defaults.
#
# Place at ~/.quorum/serve/<owner>__<repo>.toml (e.g. ag2trust__quorum.toml)
# to load automatically, or pass --config <path> explicitly.
#
# Corresponding CLI flags override file values; diagnostics without flags are file-only.
# Unknown keys are rejected (exit 2) — typos fail loud.

# ── identity ──────────────────────────────────────────────────────────
repo     = "ag2trust/quorum"
repo_dir = "/home/user/dev/quorum"

# ── paths (under ~/.quorum/serve/<repo>/ — survives reboots, unlike /tmp) ──
worktree_base = "/home/user/.quorum/serve/quorum/worktrees"
# Includes per-agent session directories and serve.log (1 MiB rotation; 3 files kept).
log_dir       = "/home/user/.quorum/serve/quorum/logs"

# ── agent spawn and model routing ─────────────────────────────────────
cap = 4
# Children of one decomposition graph that may be working at once. Unset
# defaults to cap; must be >= 1 (0 or negative is bad config, exit 2); values
# above cap are effectively bounded by cap.
# max_graph_children_working = 4
# Graphs that may be counted (active, blocked, or planning) at once across the
# daemon. Unset defaults to 2; must be >= 1 (0 or negative is bad config,
# exit 2). Enforced atomically at planning admission and activation; one graph
# still plans at a time.
# max_active_graphs = 2
# names_file = "/home/user/.quorum/serve/names.txt"
# agent_bin  = "claude"

# Routing is a hard cutover: legacy fixed agent/provider/model/effort and
# worker_model/review_model/classifier_model/collector_model keys are rejected.
# Every pool uses positive integer percentages totaling exactly 100. Quorum
# persists and shuffles a 100-slot epoch, then advances its position atomically
# with assignment creation. R1 and R2 use independent bags.
[model_profiles.terra]
runner = "codex"
model = "gpt-5.6-terra"
effort = "high"

[model_profiles.opus]
runner = "claude"
model = "claude-opus-5-5"
effort = "high"

# Classifier and collector turns fail over to another pool profile when a
# provider is unavailable, so name two providers. A single-provider pool can
# only alert the owner and retry within each role's budget: task classification
# stays pending, planning classification holds its graph and fails the source
# task after two provider failures, and a collection dead-letters after five
# attempts. The second provider's weight is the share of normal traffic it
# receives.
[routing.classifier]
terra = 95
opus = 5
[routing.planner]
opus = 100
[routing.collector]
terra = 95
opus = 5
[routing.worker.1]
terra = 100
[routing.worker.2]
terra = 100
[routing.worker.3]
terra = 80
opus = 20
[routing.worker.4]
opus = 100
[routing.worker.5]
opus = 100
[routing.reviewer.1]
terra = 100
[routing.reviewer.2]
terra = 100
[routing.reviewer.3]
terra = 80
opus = 20
[routing.reviewer.4]
opus = 100
[routing.reviewer.5]
opus = 100

# Grok profiles may appear only in worker routing pools; other roles are rejected at startup.
# [grok]
# sandbox = "off"   # off|workspace
# permission_mode = "bypassPermissions"
# max_turns = 256   # 1..=256

# ── cost ceilings ────────────────────────────────────────────────────
max_idle_secs = 900              # 15 min without an event
max_task_wall_secs = 14400      # 4h
# max_turn_tokens  = 500000
# max_task_tokens  = 2000000
# token_limit_basis = "raw"        # raw (default): input + output; uncached: uncached input + output
max_turn_cost_usd  = 50.0
max_task_cost_usd  = 100.0

# ── merge ─────────────────────────────────────────────────────────────
# merge_token_file         = "/home/user/.quorum/serve/merge-token"
# Without merge_token_file, the daemon merges in one-identity mode: it shares its
# publishing identity with the PRs it merges, so it cannot post a formal
# APPROVE/REQUEST_CHANGES on its own PR and posts a COMMENT verdict instead. If branch
# protection requires an approving review from someone other than the author, that
# review still needs a person; the daemon parks the merge until one is given.
merge_checks_timeout_secs  = 900
# merge_checks_poll_secs   = 30
# Required for every configured branch sync. Syncs fail closed once published
# when this is empty, even though ordinary task merges may leave it unset.
required_jobs = ["ci"]

# ── self-update ───────────────────────────────────────────────────────
self_update_drain = true
drain_timeout_secs = 900
# self_repo = "ag2trust/quorum"  # auto-detected from repo_dir

# ── misc ──────────────────────────────────────────────────────────────
base_branch = "main"
# Directed source/target pairs eligible for daemon-internal branch sync.
# Each pair is one-way; configure both directions explicitly when two
# branches should each receive the other's changes. Omit or set [] to
# disable. Example for a develop/main workflow: [["main", "develop"]] merges
# hotfixes back; [["develop", "main"]] promotes on demand.
# The clean path is task-less: pin → prepare → publish → checks → merge; a
# conflict or CI failure creates one judgment task with R1-only scoped review.
# Inspect active syncs with `quorum status` or `quorum branch-sync --list`;
# cancel a clean-path row with `quorum branch-sync --cancel <id> --by <agent>`.
#
# Every enabled sync pair REQUIRES the non-empty `required_jobs` gate above:
# a branch sync fails loudly once published if the effective gate is empty.
sync_pairs = []

# ── agent MCP listener ───────────────────────────────────────────────
# serve binds the agent MCP (Streamable HTTP at http://<addr>/mcp) at
# startup and exports QUORUM_AGENT_MCP_URL to every managed run; the bearer
# is the run's QUORUM_RUN_ID. Loopback by default. A non-loopback bind
# requires explicit allowed hosts. orchestrator_mcp_listen only declares the
# separately run orchestrator-mcp address so startup can refuse a clash.
# agent_mcp_listen = "127.0.0.1:0"
# agent_mcp_allowed_hosts = ["quorum.internal:8812"]
# orchestrator_mcp_listen = "127.0.0.1:8811"

# ── observational host resources ─────────────────────────────────────
# These values affect status severity and transition-only daemon warnings.
# They never throttle agents or change task lifecycle.
resource_poll_secs = 30
disk_warn_free_gib = 80
disk_critical_free_gib = 40
memory_warn_available_pct = 15
memory_critical_available_pct = 8

# Claude authentication mode:
#   no_bare_agent = true  (default) — inherit operator's Claude login; no --bare
#   no_bare_agent = false            — pass --bare; requires non-interactive
#                                      credentials (e.g. ANTHROPIC_API_KEY) in
#                                      the daemon environment
# no_bare_agent = true

# ── doctor agent ──────────────────────────────────────────────────────
# One-shot troubleshooter for tasks stalled with no active worker/reviewer.
# Default OFF — the deterministic ladder (stir → reap → terminal+notify)
# is the complete behavior when disabled. Enable only after the
# deterministic ladder is battle-tested.
# doctor_enabled = false
