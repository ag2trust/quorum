# Quorum serve config — production-sane defaults.
#
# Place at ~/.quorum/serve/<owner>__<repo>.toml (e.g. ag2trust__quorum.toml)
# to load automatically, or pass --config <path> explicitly.
#
# CLI flags override every value here (explicit wins).
# Unknown keys are rejected (exit 2) — typos fail loud.

# ── identity ──────────────────────────────────────────────────────────
repo     = "ag2trust/quorum"
repo_dir = "/home/user/dev/quorum"

# ── paths (under ~/.quorum/serve/<repo>/ — survives reboots, unlike /tmp) ──
worktree_base = "/home/user/.quorum/serve/quorum/worktrees"
log_dir       = "/home/user/.quorum/serve/quorum/logs"

# ── agent spawn and model routing ─────────────────────────────────────
cap = 4
# names_file = "/home/user/.quorum/serve/names.txt"
# agent_bin  = "claude"

# Routing is a hard cutover: legacy fixed agent/provider/model/effort and
# worker_model/review_model/classifier_model/collector_model keys are rejected.
# Every pool uses positive integer percentages totaling exactly 100. Quorum
# persists and shuffles a 100-slot epoch, then advances its position atomically
# with assignment creation. R1 and R2 use independent bags.
[model_profiles.terra]
runner = "codex"
model = "gpt-5.6-terra"
effort = "high"

[model_profiles.opus]
runner = "claude"
model = "claude-opus-4-8"
effort = "high"

[routing.classifier]
terra = 100
[routing.planner]
opus = 100
[routing.collector]
terra = 100
[routing.worker.1]
terra = 100
[routing.worker.2]
terra = 100
[routing.worker.3]
terra = 80
opus = 20
[routing.worker.4]
opus = 100
[routing.worker.5]
opus = 100
[routing.reviewer.1]
terra = 100
[routing.reviewer.2]
terra = 100
[routing.reviewer.3]
terra = 80
opus = 20
[routing.reviewer.4]
opus = 100
[routing.reviewer.5]
opus = 100

# ── cost ceilings ────────────────────────────────────────────────────
max_idle_secs = 900              # 15 min between turns
max_task_wall_secs = 14400      # 4h
# max_turn_tokens  = 500000
# max_task_tokens  = 2000000
max_turn_cost_usd  = 50.0
max_task_cost_usd  = 100.0

# ── merge ─────────────────────────────────────────────────────────────
# merge_token_file         = "/home/user/.quorum/serve/merge-token"
merge_checks_timeout_secs  = 900
# merge_checks_poll_secs   = 30

# ── self-update ───────────────────────────────────────────────────────
self_update_drain = true
drain_timeout_secs = 900
# self_repo = "ag2trust/quorum"  # auto-detected from repo_dir

# ── misc ──────────────────────────────────────────────────────────────
base_branch = "main"

# Claude authentication mode:
#   no_bare_agent = true  (default) — inherit operator's Claude login; no --bare
#   no_bare_agent = false            — pass --bare; requires non-interactive
#                                      credentials (e.g. ANTHROPIC_API_KEY) in
#                                      the daemon environment
# no_bare_agent = true

# ── doctor agent ──────────────────────────────────────────────────────
# One-shot troubleshooter for tasks stalled with no active worker/reviewer.
# Default OFF — the deterministic ladder (stir → reap → terminal+notify)
# is the complete behavior when disabled. Enable only after the
# deterministic ladder is battle-tested.
# doctor_enabled = false
