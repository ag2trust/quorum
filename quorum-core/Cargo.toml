[package]
name = "quorum-core"
version.workspace = true
edition.workspace = true

[features]
# Builds the private real-process canary helper and its contract tests. This is
# intentionally absent from the default feature set and is not a quorum CLI.
test-support = []

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[[bin]]
name = "quorum-core-test-helper"
path = "test-support/main.rs"
required-features = ["test-support"]
test = false
bench = false
doc = false

[[test]]
name = "test_helper_contract"
path = "tests/test_helper_contract.rs"
required-features = ["test-support"]
