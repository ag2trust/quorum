name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # The pre-push hook's branch-base gate, enforced for pull requests so it
  # still applies to pushes that bypass hooks. It reproduces the hook's ref
  # tuple: `opened`/`reopened` checks the whole branch like a new-branch push;
  # `synchronize` checks only that push, continuing from the previous PR head
  # (`github.event.before`) like the daemon's continuation publication. Pushes
  # to main are already-reviewed merges, so the job passes without checking
  # them and keeps `test` running there.
  branch-base:
    name: branch-base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - name: Check PR branch base
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.base_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BEFORE_SHA: ${{ github.event.action == 'synchronize' && github.event.before || '' }}
        run: |
          set -- --quick --pr-base="$PR_BASE" --proposed-sha="$PR_HEAD_SHA"
          if [ -n "$PR_BEFORE_SHA" ]; then
            set -- "$@" --continuation-from="$PR_BEFORE_SHA"
          fi
          ./preflight.sh "$@"
      - name: Not a pull request
        if: github.event_name != 'pull_request'
        run: echo "branch-base checks pull requests only"

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test
    needs: [fmt, branch-base, clippy, shell-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Compile once, then keep the existing four-thread budget split across
      # two independently supervised test binaries. The prerequisite jobs keep
      # this expensive gate from running after an early mechanical failure. A
      # merge-checks fixture exercises the minimum 30-second polling interval,
      # so its binary needs headroom for that bounded wait on CI runners.
      - run: >-
          scripts/preflight/timing.sh
          --skip-fmt
          --skip-clippy
          --test-jobs 2
          --test-threads 2
          --test-timeout-secs 210
          --out target/ci-test-timing

  shell-tests:
    name: shell-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure git for test repos
        run: |
          git config --global user.email "ci@test.com"
          git config --global user.name "CI"
      - run: scripts/test-serve-supervisor.sh
      - run: scripts/test-dev-install.sh
      - run: scripts/test-dogfood-install.sh
      - run: scripts/test-preflight.sh
      - run: scripts/test-preflight-pr-base.sh
      - run: scripts/test-preflight-resource-guards.sh
      - run: docker/entrypoint_test.sh

  container:
    name: container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install --yes sqlite3
      - run: docker buildx build --load --platform linux/amd64 --tag quorum:ci .
      - run: docker/verify.sh quorum:ci
