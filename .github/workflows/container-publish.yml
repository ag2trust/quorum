name: container-publish

# Reusable build-once → test → push-by-digest → attest pipeline for the public
# linux/amd64 Quorum image.
#
# `build-test` builds the image exactly once at the release revision, runs
# docker/verify.sh against that loaded image, and uploads its `docker save`
# archive. `publish` never builds: it downloads that archive, checks its
# sha256 and image identity against the build-test outputs, pushes it to
# ghcr.io/ag2trust/quorum by digest only (no tag of any kind is created, so
# there is no staging reference to clean up), then attests SLSA provenance and
# an SPDX JSON SBOM of that exact digest with keyless Sigstore OIDC signing.
#
# Release-tag promotion and clean-runner verification are separate workflows.
on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag (v<version>); recorded only, never applied to the registry'
        required: true
        type: string
      version:
        description: 'Release version for the org.opencontainers.image.version label'
        required: true
        type: string
      revision:
        description: 'Full 40-hex source commit to build and label'
        required: true
        type: string
    outputs:
      digest:
        description: 'Registry manifest digest (sha256:<hex>) of the pushed, attested image'
        value: ${{ jobs.publish.outputs.digest }}
      image_id:
        description: 'Config digest (sha256:<hex>) of the tested image'
        value: ${{ jobs.publish.outputs.image_id }}

permissions: {}

env:
  IMAGE_REPOSITORY: ghcr.io/ag2trust/quorum
  PLATFORM: linux/amd64
  # Local-only name for the single build; it is never pushed.
  CANDIDATE: quorum-release-candidate:build
  ARCHIVE: quorum-image.tar

jobs:
  build-test:
    name: build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_id: ${{ steps.export.outputs.image_id }}
      local_id: ${{ steps.build.outputs.local_id }}
      archive_sha256: ${{ steps.export.outputs.archive_sha256 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Validate inputs
        env:
          TAG: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
          REVISION: ${{ inputs.revision }}
        run: |
          printf '%s\n' "$REVISION" | grep -Eqx '[0-9a-f]{40}' \
            || { echo "::error::revision must be a full 40-hex commit"; exit 1; }
          printf '%s\n' "$VERSION" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]{1,64})?' \
            || { echo "::error::version is not a release version"; exit 1; }
          [ "$TAG" = "v$VERSION" ] \
            || { echo "::error::tag must be v<version>"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false

      - name: Assert checkout is the release revision
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          head=$(git rev-parse HEAD)
          [ "$head" = "$REVISION" ] \
            || { echo "::error::checked out $head, expected $REVISION"; exit 1; }

      - name: Pin check (Dockerfile and this workflow)
        run: docker/pin-check.sh .github/workflows/container-publish.yml

      - name: Install verification tooling
        run: sudo apt-get update && sudo apt-get install --yes sqlite3

      # The only build of the release artifact. Provenance/SBOM build
      # attestations are disabled so the result is one image manifest, not an
      # index; the published attestations are created by `publish`.
      - name: Build linux/amd64 image once
        id: build
        env:
          VERSION: ${{ inputs.version }}
          REVISION: ${{ inputs.revision }}
        run: |
          docker buildx build --load \
            --platform "$PLATFORM" \
            --provenance=false --sbom=false \
            --build-arg "QUORUM_VERSION=$VERSION" \
            --build-arg "QUORUM_REVISION=$REVISION" \
            --iidfile "$RUNNER_TEMP/iid" \
            --tag "$CANDIDATE" \
            .
          local_id=$(cat "$RUNNER_TEMP/iid")
          inspected=$(docker image inspect -f '{{.Id}}' "$CANDIDATE")
          [ "$local_id" = "$inspected" ] \
            || { echo "::error::iidfile $local_id != inspected $inspected"; exit 1; }
          platform=$(docker image inspect -f '{{.Os}}/{{.Architecture}}' "$CANDIDATE")
          [ "$platform" = "$PLATFORM" ] \
            || { echo "::error::built $platform, expected $PLATFORM"; exit 1; }
          for pair in "version=$VERSION" "revision=$REVISION"; do
            key=${pair%%=*}
            actual=$(docker image inspect \
              -f "{{index .Config.Labels \"org.opencontainers.image.$key\"}}" "$CANDIDATE")
            [ "$actual" = "${pair#*=}" ] \
              || { echo "::error::label $key is '$actual', expected '${pair#*=}'"; exit 1; }
          done
          echo "local_id=$local_id" >>"$GITHUB_OUTPUT"
          echo "built $CANDIDATE $local_id"

      - name: Verify the built image
        run: docker/verify.sh "$CANDIDATE"

      - name: Export tested image
        id: export
        env:
          LOCAL_ID: ${{ steps.build.outputs.local_id }}
        run: |
          # The tests must not have moved the candidate name to another image.
          now=$(docker image inspect -f '{{.Id}}' "$CANDIDATE")
          [ "$now" = "$LOCAL_ID" ] \
            || { echo "::error::candidate is $now after tests, built $LOCAL_ID"; exit 1; }
          out="$RUNNER_TEMP/export"
          mkdir "$out"
          docker save -o "$out/$ARCHIVE" "$CANDIDATE"
          # Image ID := sha256 of the config blob named by the archive's single
          # manifest entry; independent of the daemon's image store.
          manifest=$(tar -xOf "$out/$ARCHIVE" manifest.json)
          [ "$(printf '%s' "$manifest" | jq -r 'length')" = 1 ] \
            || { echo "::error::archive must hold exactly one image"; exit 1; }
          config_path=$(printf '%s' "$manifest" | jq -r '.[0].Config')
          tar -xOf "$out/$ARCHIVE" "$config_path" >"$RUNNER_TEMP/config.json"
          image_id="sha256:$(sha256sum "$RUNNER_TEMP/config.json" | cut -d' ' -f1)"
          [ "$(jq -r '.os + "/" + .architecture' "$RUNNER_TEMP/config.json")" = "$PLATFORM" ] \
            || { echo "::error::archived config is not $PLATFORM"; exit 1; }
          archive_sha256=$(sha256sum "$out/$ARCHIVE" | cut -d' ' -f1)
          echo "image_id=$image_id" >>"$GITHUB_OUTPUT"
          echo "archive_sha256=$archive_sha256" >>"$GITHUB_OUTPUT"
          echo "exported image $image_id archive sha256 $archive_sha256"

      - name: Upload tested image archive
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quorum-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/export/${{ env.ARCHIVE }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: push by digest and attest
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.result.outputs.digest }}
      image_id: ${{ steps.result.outputs.image_id }}
    env:
      IMAGE_ID: ${{ needs.build-test.outputs.image_id }}
      LOCAL_ID: ${{ needs.build-test.outputs.local_id }}
      ARCHIVE_SHA256: ${{ needs.build-test.outputs.archive_sha256 }}
      CRANE_VERSION: v0.22.1
      CRANE_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0
      SYFT_VERSION: 1.57.2
      SYFT_SHA256: ad92bd3ec1b94a3df01d4d0aec199afa9c42b72e86da436ff5f837914d32706b
      SYFT_CHECK_FOR_APP_UPDATE: 'false'
    steps:
      # No checkout: this job runs only pinned, checksummed tools on the
      # tested archive.
      - name: Install pinned crane and syft
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin" "$RUNNER_TEMP/dl"
          cd "$RUNNER_TEMP/dl"
          curl --fail --location --show-error --silent --output crane.tar.gz \
            "https://github.com/google/go-containerregistry/releases/download/$CRANE_VERSION/go-containerregistry_Linux_x86_64.tar.gz"
          curl --fail --location --show-error --silent --output syft.tar.gz \
            "https://github.com/anchore/syft/releases/download/v$SYFT_VERSION/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n%s  %s\n' "$CRANE_SHA256" crane.tar.gz "$SYFT_SHA256" syft.tar.gz \
            | sha256sum --check --strict
          tar -xzf crane.tar.gz -C "$bin" crane
          tar -xzf syft.tar.gz -C "$bin" syft
          echo "$bin" >>"$GITHUB_PATH"

      - name: Download tested image archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build-test.outputs.artifact_id }}
          path: ${{ runner.temp }}/import
          digest-mismatch: error

      - name: Check and load the tested archive
        run: |
          archive="$RUNNER_TEMP/import/$ARCHIVE"
          printf '%s  %s\n' "$ARCHIVE_SHA256" "$archive" | sha256sum --check --strict
          config_path=$(tar -xOf "$archive" manifest.json | jq -r '.[0].Config')
          archived_id="sha256:$(tar -xOf "$archive" "$config_path" | sha256sum | cut -d' ' -f1)"
          [ "$archived_id" = "$IMAGE_ID" ] \
            || { echo "::error::archive config $archived_id != tested $IMAGE_ID"; exit 1; }
          docker load -i "$archive"
          loaded=$(docker image inspect -f '{{.Id}}' "$CANDIDATE")
          [ "$loaded" = "$LOCAL_ID" ] \
            || { echo "::error::loaded image ID $loaded != tested $LOCAL_ID"; exit 1; }
          platform=$(docker image inspect -f '{{.Os}}/{{.Architecture}}' "$CANDIDATE")
          [ "$platform" = "$PLATFORM" ] \
            || { echo "::error::loaded $platform, expected $PLATFORM"; exit 1; }
          echo "loaded tested image $loaded (config $IMAGE_ID)"

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # crane writes the manifest to <repository>@<digest>, so no tag is ever
      # created; the digest is computed from the archive before the push.
      - name: Push by digest (no tag)
        id: push
        run: |
          archive="$RUNNER_TEMP/import/$ARCHIVE"
          digest=$(crane digest --tarball "$archive")
          printf '%s\n' "$digest" | grep -Eqx 'sha256:[0-9a-f]{64}' \
            || { echo "::error::bad computed digest '$digest'"; exit 1; }
          ref="$IMAGE_REPOSITORY@$digest"
          pushed=$(crane push "$archive" "$ref")
          [ "$pushed" = "$ref" ] \
            || { echo "::error::crane pushed '$pushed', expected $ref"; exit 1; }
          crane manifest "$ref" >"$RUNNER_TEMP/manifest.json"
          remote_digest="sha256:$(sha256sum "$RUNNER_TEMP/manifest.json" | cut -d' ' -f1)"
          [ "$remote_digest" = "$digest" ] \
            || { echo "::error::registry manifest $remote_digest != pushed $digest"; exit 1; }
          jq -e 'has("manifests") | not' "$RUNNER_TEMP/manifest.json" >/dev/null \
            || { echo "::error::$ref is an index; expected one image manifest"; exit 1; }
          remote_config=$(jq -r '.config.digest' "$RUNNER_TEMP/manifest.json")
          [ "$remote_config" = "$IMAGE_ID" ] \
            || { echo "::error::registry config $remote_config != tested $IMAGE_ID"; exit 1; }
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
          echo "pushed $ref (config $IMAGE_ID)"

      - name: Generate SPDX JSON SBOM of the pushed digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          sbom="$RUNNER_TEMP/sbom.spdx.json"
          syft scan "registry:$IMAGE_REPOSITORY@$DIGEST" --platform "$PLATFORM" \
            --quiet --output "spdx-json=$sbom"
          jq -e --arg hex "${DIGEST#sha256:}" '
            (.spdxVersion | startswith("SPDX-2."))
            and any(.packages[]; (.SPDXID | test("DocumentRoot"))
              and any(.checksums[]?; .algorithm == "SHA256" and .checksumValue == $hex))
          ' "$sbom" >/dev/null \
            || { echo "::error::SBOM does not describe $DIGEST"; exit 1; }
          echo "SBOM $(wc -c <"$sbom") bytes for $DIGEST"

      - name: Attest build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/ag2trust/quorum
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: false
          create-storage-record: false

      - name: Attest SBOM
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/ag2trust/quorum
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: false
          create-storage-record: false

      - name: Record result
        id: result
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          PROVENANCE_ID: ${{ steps.provenance.outputs.attestation-id }}
          SBOM_ID: ${{ steps.sbom.outputs.attestation-id }}
        run: |
          [ -n "$PROVENANCE_ID" ] && [ -n "$SBOM_ID" ] \
            || { echo "::error::missing attestation for $DIGEST"; exit 1; }
          echo "digest=$DIGEST" >>"$GITHUB_OUTPUT"
          echo "image_id=$IMAGE_ID" >>"$GITHUB_OUTPUT"
          echo "published $IMAGE_REPOSITORY@$DIGEST image $IMAGE_ID; attestations $PROVENANCE_ID $SBOM_ID"

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
