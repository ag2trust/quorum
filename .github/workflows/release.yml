name: release

# Build the `quorum` binary for every agent host platform and attach it to a GitHub
# Release whenever a `v*` tag is pushed. This is the toolchain-free distribution path
# (#60): hosts without `cargo` install via `install.sh`, which pulls these assets.
on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      tag:
        description: 'Tag name (e.g. v0.2.3) — passed by auto-tag workflow'
        required: true
        type: string

# Every job declares its own permissions; nothing is granted workflow-wide. When this
# runs via workflow_call (auto-tag.yml) the caller must grant the union of these.
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # required to create the Release and upload assets
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The real agent hosts: x86_64 Linux droplets + dev Macs (Apple Silicon + Intel).
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} --bin quorum
      - name: Package tarball + checksum
        run: |
          tar -C "target/${{ matrix.target }}/release" -czf "quorum-${{ matrix.target }}.tar.gz" quorum
          shasum -a 256 "quorum-${{ matrix.target }}.tar.gz" > "quorum-${{ matrix.target }}.tar.gz.sha256"
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            quorum-${{ matrix.target }}.tar.gz
            quorum-${{ matrix.target }}.tar.gz.sha256

  # Resolve the container release identity from the authorized release tag only.
  container-meta:
    name: resolve container release identity
    if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      revision: ${{ steps.meta.outputs.revision }}
    steps:
      - name: Resolve tag, version, and tagged commit
        id: meta
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          printf '%s\n' "$TAG" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]{1,64})?' \
            || { echo "::error::'$TAG' is not a v<version> release tag"; exit 1; }
          # Peel the tag (lightweight or annotated) to the commit it names.
          revision=$(gh api "repos/$GH_REPO/commits/tags/$TAG" --jq .sha)
          printf '%s\n' "$revision" | grep -Eqx '[0-9a-f]{40}' \
            || { echo "::error::cannot resolve commit for $TAG"; exit 1; }
          {
            echo "tag=$TAG"
            echo "version=${TAG#v}"
            echo "revision=$revision"
          } >>"$GITHUB_OUTPUT"
          echo "container release $TAG -> $revision"

  container-publish:
    name: container publish
    needs: container-meta
    uses: ./.github/workflows/container-publish.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      tag: ${{ needs.container-meta.outputs.tag }}
      version: ${{ needs.container-meta.outputs.version }}
      revision: ${{ needs.container-meta.outputs.revision }}

  # Runs only after the image is pushed and attested and the native Release exists.
  container-promote:
    name: container verify and promote
    needs: [build, container-meta, container-publish]
    uses: ./.github/workflows/container-promote.yml
    permissions:
      contents: write
      packages: write
      attestations: read
    with:
      tag: ${{ needs.container-meta.outputs.tag }}
      version: ${{ needs.container-meta.outputs.version }}
      revision: ${{ needs.container-meta.outputs.revision }}
      digest: ${{ needs.container-publish.outputs.digest }}
      image_id: ${{ needs.container-publish.outputs.image_id }}
      # Attestations are signed by the reusable publish workflow's identity.
      signer_workflow: ${{ github.repository }}/.github/workflows/container-publish.yml
