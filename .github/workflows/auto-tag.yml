name: auto-tag

# On every push to main, read the workspace version from Cargo.toml and create
# the matching v<version> tag if it doesn't already exist. This eliminates the
# manual `./bump-version.sh tag` step after merging a version-bump PR.
#
# Tags created by GITHUB_TOKEN don't trigger `on: push: tags` in other
# workflows, so this workflow chains the release build directly via
# workflow_call instead of relying on a separate tag-push event.
on:
  push:
    branches: [main]

permissions:
  contents: write # required to push the tag and create the Release

jobs:
  tag:
    name: auto-tag if version changed
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      created: ${{ steps.check.outputs.created }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need tags for the existence check
          fetch-tags: true

      - name: Check version and create tag
        id: check
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          tag="v${version}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists — nothing to do"
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            git tag "${tag}"
            git push origin "${tag}"
            echo "Created and pushed ${tag}"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
