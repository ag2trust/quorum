[package]
name = "quorum"
version.workspace = true
edition.workspace = true

[[bin]]
name = "quorum"
path = "src/main.rs"

[[bin]]
name = "fake-agent"
path = "src/bin/fake_agent.rs"

[dependencies]
quorum-core = { path = "../quorum-core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
toml = "0.8"
directories = "5"
tokio = { version = "1", features = ["rt-multi-thread", "process", "macros", "io-util", "time", "signal", "sync", "net"] }
axum = "0.7"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
tempfile = "3"
rusqlite = { version = "0.31", features = ["bundled"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
rmcp = { version = "=3.0.1", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serde_json = "1"
libc = "0.2"
