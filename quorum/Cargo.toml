[package]
name = "quorum"
version.workspace = true
edition.workspace = true

[[bin]]
name = "quorum"
path = "src/main.rs"

[[bin]]
name = "fake-agent"
path = "src/bin/fake_agent.rs"

[dependencies]
quorum-core = { path = "../quorum-core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "5"
tokio = { version = "1", features = ["rt-multi-thread", "process", "macros", "io-util", "time", "signal", "sync"] }
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
# Direct DB handle for a handful of daemon-side helpers that need a
# Connection type in their signature (see serve::interpreter). All schema is
# owned by quorum-core; this crate never CREATE/ALTERs.
rusqlite = { version = "0.31", features = ["bundled"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
serde_json = "1"
libc = "0.2"
