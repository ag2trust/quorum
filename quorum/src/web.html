<!doctype html><meta charset="utf-8"><title>Quorum dashboard</title>
<style>body{font:14px system-ui;margin:20px;background:#101317;color:#e7edf5}a{color:#76b7ff}button{margin:3px}table{border-collapse:collapse;width:100%;margin:10px 0}td,th{padding:6px;border-bottom:1px solid #29313b;text-align:left}.tile{display:inline-block;background:#1b222b;padding:12px;margin:4px;min-width:95px}.hidden{display:none}pre{white-space:pre-wrap;background:#080a0d;padding:12px;max-height:65vh;overflow:auto}</style>
<h1>Quorum</h1><nav><button onclick="show('board')">Board</button><button onclick="show('agents')">Agents</button><button onclick="show('run')">Run detail</button></nav>
<main id="board"><div id="tiles"></div><h2>Tasks</h2><table id="tasks"></table><h2>Alerts / errors</h2><pre id="alerts"></pre></main>
<main id="agents" class="hidden"><h2>Agents</h2><table id="agentTable"></table><h2>Recent runs</h2><div id="runs"></div></main>
<main id="run" class="hidden"><h2 id="runTitle">Run detail</h2><button id="pause">Pause tail</button> <a id="start" href="#">Load from start</a><pre id="stream"></pre></main>
<script>
let openRun=null,offset=null,paused=false; const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll('main').forEach(x=>x.classList.add('hidden'));$(id).classList.remove('hidden')}
function age(s){return s<60?s+'s':Math.floor(s/60)+'m'}
async function state(){if(document.hidden)return;let s=await fetch('/api/state').then(r=>r.json());let c=Object.fromEntries(s.counts.map(x=>[x.status,x.count]));$('tiles').innerHTML=['working','open','in-review','done'].map(k=>`<span class=tile>${k}<br><b>${c[k]||0}</b></span>`).join('')+`<span class=tile>merged/hr<br><b>${s.stats.throughput.closed_last_hour}</b></span><span class=tile>stalled<br><b>${s.stats.stalled_count}</b></span>`;$('tasks').innerHTML='<tr><th>State</th><th>Task</th><th>Provider/model</th><th>PR</th><th>Age</th></tr>'+s.tasks.map(t=>`<tr><td>${t.state}</td><td>#${t.id} ${t.title}</td><td>${t.provider||'pending'} ${t.model||''}</td><td>${t.pr?'<a href="https://github.com/ag2trust/quorum/pull/'+t.pr+'">#'+t.pr+'</a>':''}</td><td>${age(t.age_secs)}</td></tr>`).join('');$('agentTable').innerHTML='<tr><th>Agent</th><th>Online</th><th>Task</th><th>Last seen</th></tr>'+s.agents.map(a=>`<tr><td>${a.run_dir?'<a href="#" onclick="openDetail(\''+a.run_dir+'\')">'+a.name+'</a>':a.name}</td><td>${a.online?'yes':'no'}</td><td>${a.task_held?('#'+a.task_held.id+' '+a.task_held.title):''}</td><td>${a.last_seen}</td></tr>`).join('');$('alerts').textContent=JSON.stringify({alerts:s.alerts,errors:s.errors},null,2)}
async function runs(){if(document.hidden)return;let r=await fetch('/api/runs').then(x=>x.json());$('runs').innerHTML=r.runs.map(x=>`<button onclick="openDetail('${x.dir}')">${x.dir} ${x.meta.agent||''} ${x.meta.final_phase||''}</button>`).join(' ')}
async function openDetail(dir,from){openRun=dir;offset=from??null;show('run');$('runTitle').textContent=dir;await tail()}
async function tail(){if(!openRun||paused||document.hidden)return;let u='/api/runs/'+encodeURIComponent(openRun)+'/stream?max=2097152'+(offset!==null?'&from='+offset:'');let r=await fetch(u).then(x=>x.json());if(offset!==null)$('stream').textContent+=r.lines.join('\n')+(r.lines.length?'\n':'');else $('stream').textContent=r.lines.join('\n');offset=r.next_offset;$('stream').scrollTop=$('stream').scrollHeight}
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'Resume tail':'Pause tail'};$('start').onclick=e=>{e.preventDefault();openDetail(openRun,0)};document.addEventListener('visibilitychange',()=>{if(!document.hidden){state();runs();tail()}});state();runs();setInterval(state,2000);setInterval(runs,5000);setInterval(tail,1000);
</script>
