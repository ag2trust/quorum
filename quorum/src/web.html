<!doctype html><meta charset="utf-8"><title>Quorum dashboard</title>
<style>body{font:14px system-ui;margin:20px;background:#101317;color:#e7edf5}a{color:#76b7ff}button{margin:3px}table{border-collapse:collapse;width:100%;margin:10px 0}td,th{padding:6px;border-bottom:1px solid #29313b;text-align:left;vertical-align:top}.tile{display:inline-block;background:#1b222b;padding:12px;margin:4px;min-width:95px}.hidden{display:none}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#080a0d;padding:12px;max-height:65vh;overflow:auto}.run-stream{max-width:100%;overflow-x:hidden}.run-row{border-bottom:1px solid #29313b;padding:8px 2px;overflow-wrap:anywhere}.run-message{white-space:pre-wrap;line-height:1.45}.run-command{cursor:pointer}.run-command summary{list-style:none}.run-command summary::-webkit-details-marker{display:none}.run-command summary:before{content:'▸ ';color:#9aa}.run-command[open] summary:before{content:'▾ '}.badge{padding:1px 5px;border-radius:8px;background:#39414d;margin-left:8px;font-size:12px}.ok{background:#1e6b45}.bad{background:#8a3030}.dim{color:#9aa5b1}.raw{max-height:65vh}.clickable{cursor:pointer}.offline-summary{margin:10px 0}</style>
<h1>Quorum</h1><nav><button data-view="board">Board</button><button data-view="agents">Agents</button><button data-view="run">Run detail</button></nav>
<main id="board"><div id="tiles"></div><h2>Tasks</h2><table id="tasks"></table><h2>Alerts / errors</h2><pre id="alerts"></pre></main><main id="agents" class="hidden"><h2>Agents</h2><table id="agentTable"></table><details id="offlineAgents" class="offline-summary"><summary></summary><table id="offlineAgentTable"></table></details><h2>Recent runs</h2><table id="runs"></table><button id="moreRuns" class="hidden">Load older runs</button></main><main id="run" class="hidden"><h2 id="runTitle">Run detail</h2><button id="pause">Pause tail</button> <a id="start" href="#">Load from start</a> <button id="rawToggle">Show raw</button><div id="stream" class="run-stream"></div><pre id="rawStream" class="raw hidden"></pre></main>
<script src="/web.js"></script>
