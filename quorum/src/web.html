<!doctype html><meta charset="utf-8"><title>Quorum dashboard</title>
<style>body{font:14px system-ui;margin:20px;background:#101317;color:#e7edf5}a{color:#76b7ff}button{margin:3px}table{border-collapse:collapse;width:100%;margin:10px 0}td,th{padding:6px;border-bottom:1px solid #29313b;text-align:left}.tile{display:inline-block;background:#1b222b;padding:12px;margin:4px;min-width:95px}.hidden{display:none}pre{white-space:pre-wrap;background:#080a0d;padding:12px;max-height:65vh;overflow:auto}</style>
<h1>Quorum</h1><nav><button data-view="board">Board</button><button data-view="agents">Agents</button><button data-view="run">Run detail</button></nav>
<main id="board"><div id="tiles"></div><h2>Tasks</h2><table id="tasks"></table><h2>Alerts / errors</h2><pre id="alerts"></pre></main><main id="agents" class="hidden"><h2>Agents</h2><table id="agentTable"></table><h2>Recent runs</h2><div id="runs"></div></main><main id="run" class="hidden"><h2 id="runTitle">Run detail</h2><button id="pause">Pause tail</button> <a id="start" href="#">Load from start</a><pre id="stream"></pre></main>
<script>
let openRun=null,offset=null,paused=false;const MAX_RENDERED_TAIL_CHARS=2*1024*1024,$=id=>document.getElementById(id);const put=(n,v)=>{n.textContent=v??'';return n};
function show(id){document.querySelectorAll('main').forEach(n=>n.classList.toggle('hidden',n.id!==id))}document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.view)));
function appendRow(table,values,head=false){let tr=document.createElement('tr');values.forEach(v=>{let cell=document.createElement(head?'th':'td');cell.append(v instanceof Node?v:put(document.createTextNode(''),v));tr.append(cell)});table.append(tr)}function age(s){return s<60?s+'s':Math.floor(s/60)+'m'}
async function state(){if(document.hidden)return;let s=await fetch('/api/state').then(r=>r.json()),c=Object.fromEntries(s.counts.map(x=>[x.status,x.count]));$('tiles').replaceChildren();['working','open','in-review','done'].forEach(k=>{let d=document.createElement('span');d.className='tile';put(d,k+'\n'+(c[k]||0));$('tiles').append(d)});let t=$('tasks');t.replaceChildren();appendRow(t,['State','Task','Provider/model','PR','Age'],true);s.tasks.forEach(x=>{let pr=document.createElement('span');if(x.pr){let a=document.createElement('a');a.href='https://github.com/ag2trust/quorum/pull/'+x.pr;put(a,'#'+x.pr);pr.append(a)}appendRow(t,[x.state,'#'+x.id+' '+x.title,(x.provider||'pending')+' '+(x.model||''),pr,age(x.age_secs)])});let a=$('agentTable');a.replaceChildren();appendRow(a,['Agent','Online','Task','Last seen'],true);s.agents.forEach(x=>{let name=document.createElement(x.run_dir?'button':'span');put(name,x.name);if(x.run_dir)name.addEventListener('click',()=>openDetail(x.run_dir));appendRow(a,[name,x.online?'yes':'no',x.task_held?('#'+x.task_held.id+' '+x.task_held.title):'',x.last_seen])});$('alerts').textContent=JSON.stringify({alerts:s.alerts,errors:s.errors},null,2)}
async function runs(){if(document.hidden)return;let r=await fetch('/api/runs').then(x=>x.json()),box=$('runs');box.replaceChildren();r.runs.forEach(x=>{let b=document.createElement('button');put(b,x.dir+' '+(x.meta.agent||'')+' '+(x.meta.final_phase||''));b.addEventListener('click',()=>openDetail(x.dir));box.append(b)})}
async function openDetail(dir,from){openRun=dir;offset=from??null;show('run');put($('runTitle'),dir);await tail()}function appendTail(text,replace){let stream=$('stream'),next=(replace?'':stream.textContent)+text;stream.textContent=next.length>MAX_RENDERED_TAIL_CHARS?next.slice(-MAX_RENDERED_TAIL_CHARS):next}async function tail(){if(!openRun||paused||document.hidden)return;let u='/api/runs/'+encodeURIComponent(openRun)+'/stream?max=2097152'+(offset!==null?'&from='+offset:''),r=await fetch(u).then(x=>x.json());appendTail(r.lines.join('\n')+(r.lines.length?'\n':''),offset===null);offset=r.next_offset;$('stream').scrollTop=$('stream').scrollHeight}$('pause').onclick=()=>{paused=!paused;put($('pause'),paused?'Resume tail':'Pause tail')};$('start').onclick=e=>{e.preventDefault();openDetail(openRun,0)};document.addEventListener('visibilitychange',()=>{if(!document.hidden){state();runs();tail()}});state();runs();setInterval(state,2000);setInterval(runs,5000);setInterval(tail,1000);
</script>
